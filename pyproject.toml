[project]
name = "perplex"
version = "2.0.0"
description = "Discord Rich Presence for Plex with TMDB posters, director, runtime and a progress bar."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "PlexAPI>=4.18.0",
    "pypresence>=4.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
perplex = "perplex.__main__:main"

[tool.setuptools]
packages = ["perplex"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
