[project]
name = "perplex"
version = "2.1.0"
description = "Discord Rich Presence for Plex with TMDB posters, director, runtime and a progress bar."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "PlexAPI>=4.18.0",
    "pypresence>=4.6.2",
    "pystray>=0.19.5",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
perplex = "perplex.__main__:main"

[project.gui-scripts]
perplex-tray = "perplex.tray:main"

[tool.setuptools]
packages = ["perplex"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
